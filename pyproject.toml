[project]
name = "enterprise-ai-logistics"
version = "0.1.0"
description = "Autonomous B2B logistics copilot powered by Google Gemini 1.5 Pro"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Ibrahim Ghabban" }]
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
